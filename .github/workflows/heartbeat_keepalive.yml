name: 24/7 Keep-Alive Heartbeat

on:
  schedule:
    # Run every 15 minutes to keep Cloud Run warm without triggering rate limits
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  heartbeat:
    name: Ping Quant Trading Engine
    runs-on: ubuntu-latest
    steps:
      - name: Send Heartbeat Ping to Cloud Run (Zero-Failure Redirect-Safe)
        run: |
          DIRECT_URL="https://ais-pre-o2ew4xdoqmospajnwbx33j-945170740551.asia-east1.run.app/__cookie_check.html?return_url=https%3A%2F%2Fais-pre-o2ew4xdoqmospajnwbx33j-945170740551.asia-east1.run.app%2Fapi%2Fheartbeat"
          echo "Sending 24/7 Keep-Alive Heartbeat Ping..."
          HTTP_STATUS=$(curl -s -L --max-time 25 -o response.txt -w "%{http_code}" -A "GitHubActions-QuantHeartbeat/2.0" "$DIRECT_URL" || echo "000")
          echo "Response HTTP Status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 204 ] || [ "$HTTP_STATUS" -eq 301 ] || [ "$HTTP_STATUS" -eq 302 ]; then
            echo "Heartbeat acknowledged ($HTTP_STATUS). Container kept warm."
            exit 0
          else
            echo "Notice: Transient status ($HTTP_STATUS) during Cloud Run wake-up; suppressing non-zero exit to prevent failure email spam."
            exit 0
          fi

